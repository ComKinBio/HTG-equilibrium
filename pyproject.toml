[project]
name = "htg-equilibrium"
version = "0.2.0"
description = "Constrained Gibbs-energy equilibrium model for hydrothermal gasification (HTG)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "pandas>=3.1",
    "matplotlib>=3.11",
    "openpyxl>=3.1",      # pandas.read_excel for Cellulose.xlsx
    "pyclapeyron>=0.1.1", # PC-SAFT / ePC-SAFT via Clapeyron.jl (installs Julia deps on first import)
    "pychnosz>=1.5.3",    # SUPCRT92 water properties and HKF ions
    "psutil>=7.2.2",
    "nicegui>=4.0.0",
    "plotly>=7.1.0",
    "tomlkit>=0.15.2",
]

[project.scripts]
htg = "htg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=7.4",
    "jupyterlab>=4",
    "nbstripout>=0.9",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full equilibrium solves with the original finite-difference SLSQP (minutes)"]

[tool.uv.build-backend]
module-name = "htg"
